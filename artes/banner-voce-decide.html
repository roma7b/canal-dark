<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:2560px;height:1440px;background:#05080c;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background:url(tunel-cena.png) center 45%/cover;filter:brightness(.35) saturate(.9)}
.fade{position:absolute;inset:0;background:radial-gradient(60% 70% at 50% 50%,rgba(5,8,12,.2),rgba(5,8,12,.92))}
.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1546px;text-align:center}
.t{font:900 210px/1 Inter,sans-serif;letter-spacing:-0.02em}
.t i{font-style:normal;color:#ffb347}
.sub{margin-top:34px;font:700 64px/1.2 Inter,sans-serif;color:#e8dcc2}
.chips{margin-top:56px;display:flex;justify-content:center;gap:40px}
.chip{font:900 56px Inter,sans-serif;padding:22px 40px;border-radius:22px;border:5px solid}
.ca{color:#ffb347;border-color:#ffb347}.cb{color:#ff5a3d;border-color:#ff5a3d}
.tag{position:absolute;bottom:60px;width:100%;text-align:center;font:800 40px 'JetBrains Mono',monospace;letter-spacing:.14em;color:rgba(255,255,255,.55)}
</style></head><body>
<div class="bg"></div><div class="fade"></div>
<div class="box"><div class="t">VOCÊ <i>DECIDE</i></div>
<div class="sub">Histórias reais do Brasil, contadas em 2ª pessoa</div>
<div class="chips"><div class="chip ca">A · FICAR</div><div class="chip cb">B · FUGIR</div></div></div>
<div class="tag">FICÇÃO INSPIRADA EM FATOS REAIS</div>
</body></html>
