<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:2560px;height:1440px;background:#1d1b2e;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.glow{position:absolute;inset:0;background:radial-gradient(50% 60% at 50% 50%,#2d4a7a 0%,#1d1b2e 70%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,210,63,.18) 3px,transparent 3.5px);background-size:64px 64px}
.box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1546px;text-align:center}
.t{white-space:nowrap;font:900 170px/1 Inter,sans-serif;letter-spacing:-0.02em;color:#fff;-webkit-text-stroke:14px #1d1b2e;paint-order:stroke fill}
.t i{font-style:normal;color:#ffd23f}
.sub{margin-top:40px;font:800 64px/1.2 Inter,sans-serif;color:#cfe8da}
.pill{display:inline-block;margin-top:56px;font:900 52px Inter,sans-serif;color:#1d1b2e;background:#ffd23f;padding:24px 46px;border-radius:24px;border:6px solid #05080c;box-shadow:10px 10px 0 #05080c}
</style></head><body>
<div class="glow"></div><div class="dots"></div>
<div class="box"><div class="t">NINGUÉM <i>TE CONTOU</i></div>
<div class="sub">Curiosidades do dia a dia, explicadas por dentro</div>
<div class="pill">NOVO VÍDEO TODO DIA</div></div>
</body></html>
